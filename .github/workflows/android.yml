name: android
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: node tools/restore-binaries.mjs
      - run: npm ci
      - run: npm test
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk neuralese-diffusion-debug.apk && sha256sum neuralese-diffusion-debug.apk
      - uses: actions/upload-artifact@v5
        with: { name: neuralese-diffusion-android-debug-apk, path: neuralese-diffusion-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Neuralese Diffusion v2.0.0
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: neuralese-diffusion-debug.apk
