name: android
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: android, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: node tools/restore-binaries.mjs
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk neuralese-diffusion-debug.apk && sha256sum neuralese-diffusion-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: neuralese-diffusion-android-debug-apk, path: neuralese-diffusion-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Neuralese Diffusion v1.0.0
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: neuralese-diffusion-debug.apk
