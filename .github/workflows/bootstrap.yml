name: bootstrap
on:
  push:
    branches: [main]
    paths: ['bootstrap/**']
permissions: { contents: write }
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f bootstrap/bundle.tgz.b64 || exit 0
          base64 -d bootstrap/bundle.tgz.b64 | tar xzf -
          git rm -rq bootstrap || true
          git rm -q tmp/probe.txt || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm 'Neuralese Diffusion source (unpacked from bootstrap bundle)' && git push
