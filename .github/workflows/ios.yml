name: ios
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: write }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: node tools/restore-binaries.mjs
      - run: npm ci
      - run: npm test
      - run: npx cap sync ios
      - name: pod install
        run: cd ios/App && pod install
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/NeuraleseDiffusion-simulator.app.zip" App.app
      - name: Build for device (unsigned .ipa, for AltStore / Sideloadly re-signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/ && zip -qry NeuraleseDiffusion-unsigned.ipa Payload
      - name: Optional signed .ipa (only if IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISION_PROFILE_BASE64, IOS_TEAM_ID secrets exist)
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KC=$RUNNER_TEMP/b.keychain-db; security create-keychain -p x "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p x "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/c.p12; security import $RUNNER_TEMP/c.p12 -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"; security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles; echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nd.mobileprovision
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive DEVELOPMENT_TEAM="$TEAM" archive
          printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>method</key><string>development</string><key>teamID</key><string>%s</string></dict></plist>' "$TEAM" > eo.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist eo.plist -exportPath build/signed && cp build/signed/*.ipa NeuraleseDiffusion-signed.ipa
      - uses: actions/upload-artifact@v6
        with:
          name: neuralese-diffusion-ios
          path: |
            NeuraleseDiffusion-simulator.app.zip
            NeuraleseDiffusion-unsigned.ipa
            NeuraleseDiffusion-signed.ipa
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v3.0.0
          name: Neuralese Diffusion v3.0.0
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            NeuraleseDiffusion-simulator.app.zip
            NeuraleseDiffusion-unsigned.ipa
            NeuraleseDiffusion-signed.ipa
