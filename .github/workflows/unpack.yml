name: unpack-stage
on:
  push:
    branches: [stage-v2]
    paths: ['stage/**']
permissions: { contents: write, actions: write }
concurrency:
  group: unpack-stage
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: stage-v2, path: stage }
      - uses: actions/checkout@v5
        with: { ref: main, path: main }
      - run: |
          cd main
          test -f ../stage/stage/SHA.txt || exit 0
          cat ../stage/parts/ship.part.* > /tmp/s.b64
          [ "$(sha256sum /tmp/s.b64 | cut -d' ' -f1)" = "$(cat ../stage/stage/SHA.txt)" ] || { echo 'incomplete bundle, skipping'; exit 0; }
          base64 -d /tmp/s.b64 | tar xz
          git config user.name "Alex Donahue (via Grok Bot)"; git config user.email "0thernes@users.noreply.github.com"
          git add -A && git commit -F ../stage/stage/MSG.txt && git push origin main
          gh workflow run pages.yml --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
